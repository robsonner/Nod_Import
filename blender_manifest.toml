schema_version = "1.0.0"
id = "nod_import"
version = "1.0.2"
name = "VTM Redemption NOD Importer/Exporter"
tagline = "Import and export VTM Redemption NOD models and NAD animations"
maintainer = "RK"
type = "add-on"
blender_version_min = "5.2.0"
license = ["SPDX:GPL-3.0-or-later"]
tags = ["Import-Export", "Animation"]

[permissions]
files = "Read and write NOD, NAD, NMS and texture files on disk"

[build]
paths_exclude_pattern = [
    "__pycache__/",
    "/.git/",
    "/.vscode/",
    "/Docs/",
    "/tests/",
    "/dist/",
    "/.venv/",
    "/.pytest_cache/",
    "*.zip",
    "/.gitignore",
    "/.gitattributes",
    "/requirements-dev.txt",
]
